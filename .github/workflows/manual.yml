on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        description: "Choose environment"
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        run: echo "Deploying the application to ${{ inputs.environment }}"