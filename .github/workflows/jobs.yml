on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        default: "Staging"
        type: choice
        options:
          - Staging
          - Production

jobs:
  job_1:
    runs-on: ubuntu-latest

    steps:
      - run: |
          npm install
          npm run build
          working-directory: ./temp
          shell: bash
          #pwsh, cmd, powershell, python
      - name: Print Job Name
        run: "echo Job: ${{ github.job }}"

  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - run: "echo Job: ${{ github.job }}"

  job_3:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - run: "echo Job: ${{ github.job }}"

  job_4:
    runs-on: ubuntu-latest
    needs: [ job_2, job_3 ]
    steps:
      - run: "echo Job: ${{ github.job }}"
